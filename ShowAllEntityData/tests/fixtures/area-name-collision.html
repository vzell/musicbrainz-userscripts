            Standalone regression cells for the "two different MusicBrainz
            areas sharing the exact same display name" bug (reported live on

            snapshot's event row:

            - #loc-cell: the NATIVE, pre-split "Location" cell — a place
              link followed by TWO different area entities that MusicBrainz
              both render with the bare anchor text "New York": area
              74e50e58 (New York City itself, whose "More Flags Everywhere"
              userscript decoration icon carries the DISAMBIGUATED alt/title
              "New York City") and area 75e398a3 (New York the state, icon
              alt/title "New York"). Feeds
              `ColumnDataExtractor.splitLocation()` via `splitLocationAreas()`
              to verify the routing fix: the city must land in Locality
              (its icon label "new york city" is not a recognised
              AREA_FLAG_REGION_SUBDIVISIONS entry), the state alone in
              Region (its icon label "new york" IS one) — not both crammed
              into Region the way `a.textContent` alone (bare "New York" for
              BOTH links) used to force. `#loc-cell`'s country `<span
              class="flag flag-US">` deliberately carries NO `<abbr>` —
              matching real musicbrainz.org "Location"-column markup for
              this shape exactly (confirmed against debug/2-ny.html itself).
              `_findRowCountryName()` still resolves "United States" here
              via its own anchor-text fallback (no abbr needed), so
              `_routeAreaLink()`'s `forceRegion` branch genuinely activates
              on this fixture exactly as it does on a live "Location" cell —
              confirmed by temporarily reverting `_flagIconSubdivisionLabel()`
              to plain `a.textContent`, which made the state (75e398a3) drag
              the city (74e50e58) into Region alongside it, exactly
              reproducing the reported bug.

            - #region-collision-cell: a plain cell already holding BOTH
              same-named-but-different-href area entities side by side
              (independent of whichever column they end up routed into) —
              exercises the unique-values-dropdown side of the fix:
              `_findCellEntityRefs()` must report two distinct hrefs for the
              same name, and `_cellMatchesStructureMode()`'s `namehref:`
              mode must isolate exactly one of them while the broader
              `name:` mode still matches both.
        -->
