        into relationship-type groups by <tr class="subh"> rows, each of which
        renderGroupedTable() turns into its own sub-table with its own header
        and controls.

        place-performances is one of SA_SNAPSHOT_SUPPORTED_PAGETYPES, so each
        sub-table gets a "Show single-table" button — the control that drives
        the real cross-tab snapshot handoff (openSubtableAsSingleTableTab() ->
        _hydrateAndRenderFromSnapshotData()). The second group deliberately
        mirrors the reported case: a single-row "shooting location for
        recording" section.

        Column shape and the <tr class="subh"> grouping match a real page (see
        debug/place-performances-final.html, whose rendered columns are
        Date | Title | Attributes | Artist | Length | … ). Recording MBIDs and
        the seconds shown are the real values behind the WS2 payload the spec
        mocks, so MusicBrainz's own ROUNDING is exercised: 5:34.866 displays as
        "5:35".
    -->
