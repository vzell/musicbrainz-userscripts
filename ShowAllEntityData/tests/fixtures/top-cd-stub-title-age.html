<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Top CD stubs - MusicBrainz</title>
</head>
<body>
    <!--
        Mirrors top-cd-stub-lastupdate.html's own minimal skeleton (a
        separate fixture rather than adding rows to that one, since
        top-cd-stub-lastupdate-and-dedup.spec.js asserts that fixture
        renders EXACTLY one row).

        Three rows exercise the "Title info - Added"/"Title info -
        Modified" unique-values dropdown split: Row A has an IDENTICAL
        Added/Modified phrase (the case the lookaround-anchored highlight
        design exists for — a plain substring match could not tell the two
        halves apart), Row B is a distinct value pair, Row C has Added !=
        Modified (MusicBrainz can render this — see debug/top-cd-stubs-
        final.html real examples with differing year counts).
    -->
    <div class="fullwidth" id="page">
        <h1>Top CD stubs</h1>
        <table class="tbl">
            <thead>
                <tr><th>Title</th><th>Artist</th><th>Lookup count</th><th>Modify count</th></tr>
            </thead>
            <tbody>
                <tr class="odd">
                    <td><a href="/cdstub/AAAA1111"><bdi>Row A</bdi></a></td>
                    <td>Artist A</td>
                    <td>10</td>
                    <td>0</td>
                </tr>
                <tr class="odd">
                    <td class="lastupdate" colspan="4">Added 9 years ago, last modified 9 years ago</td>
                </tr>
                <tr class="even">
                    <td><a href="/cdstub/BBBB2222"><bdi>Row B</bdi></a></td>
                    <td>Artist B</td>
                    <td>20</td>
                    <td>1</td>
                </tr>
                <tr class="even">
                    <td class="lastupdate" colspan="4">Added 15 years ago, last modified 15 years ago</td>
                </tr>
                <tr class="odd">
                    <td><a href="/cdstub/CCCC3333"><bdi>Row C</bdi></a></td>
                    <td>Artist C</td>
                    <td>5</td>
                    <td>2</td>
                </tr>
                <tr class="odd">
                    <td class="lastupdate" colspan="4">Added 17 years ago, last modified 16 years ago</td>
                </tr>
            </tbody>
        </table>
        <ul class="pagination"></ul>
    </div>
</body>
</html>
