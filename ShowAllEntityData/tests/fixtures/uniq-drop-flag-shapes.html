    <!--
        One artist-events page whose "Location" column carries the THREE flag
        shapes a cell can hold, one per row, so the unique-values dropdown's
        icon rendering can be asserted against all of them at once.

        "Location" is used because `hasFlagIcons` already recognises it by name
        and the column needs no async population — the shapes are the subject,
        not the pipeline that produces them.

          ES  native, untouched          — one `span.flag` with a real sprite
          FR  RSFE's WRAPPER shape       — the flag span still wraps the area
                                           anchor, so the script neutralized it
                                           in place and put its <img> in a
                                           sibling `span.mfe-flag-wrapper`
          IT  RSFE's DIRECT-APPEND shape — the flag span has NO anchor, so the
                                           script appended its <img> INSIDE the
                                           span and left the hollow span there

        Only the first of RSFE's two shapes was excluded from `iconSel`. The
        second yielded TWO icon segments for one visible cell icon — the hollow
        span AND the img — which is the "flag before and after the name" this
        pins. The neutralizing inline styles and the data-hq-* markers are
        copied from the real script (v2026-09-16.1151): the markers are what
        `_bakeFlagIconNode()` keys on, deliberately NOT the absence of a
        background, which is also true of every perfectly good flag in a fixture
        because MusicBrainz's sprite stylesheet is not loaded here.
    -->
